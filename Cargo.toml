[package]
name = "rust-rocksdb"
description = "Rust wrapper for Facebook's RocksDB embeddable database"
version = "0.53.0"
edition = "2024"
rust-version = "1.91.0"
authors = [
    "Tyler Neely <t@jujit.su>",
    "David Greenberg <dsg123456789@gmail.com>",
]
repository = "https://github.com/zaidoon1/rust-rocksdb"
license = "Apache-2.0"
categories = ["database"]
keywords = ["database", "embedded", "LSM-tree", "persistence"]
homepage = "https://github.com/zaidoon1/rust-rocksdb"
# Nothing here compiles for a downstream user. The integration tests need a
# `tests/util` module and the bench needs criterion, neither of which a consumer
# gets. This list replaced `test/**/*`, which matched nothing because the
# directory is `tests/`.
#
# `scripts/` stays. The packaged README tells anyone enabling `coroutines` to
# run `./scripts/build_folly.sh`, so shipping the instructions without the
# script would be worse than shipping both.
exclude = [
    ".coderabbit.yaml",
    ".github/**",
    ".gitignore",
    ".gitmodules",
    ".vscode/**",
    "benches/**",
    "tests/**",
]

[workspace]
members = ["librocksdb-sys"]

# Not `all-features`. That would turn on `coroutines`, which needs a folly
# install and `ROCKSDB_FOLLY_INSTALL_PATH`, and `jemalloc`, `io-uring` and
# `valgrind`, none of which belong in a docs build. Name the set instead, the
# way rusqlite and git2 do.
#
# `--cfg docsrs` is what turns on the "available on crate feature X only"
# badges, via `feature(doc_cfg)` in lib.rs.
[package.metadata.docs.rs]
features = ["serde1", "multi-threaded-cf", "raw-ptr"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.playground]
features = ["serde1"]

[features]
default = ["snappy", "lz4", "zstd", "zlib", "bzip2", "bindgen-runtime"]
jemalloc = ["rust-librocksdb-sys/jemalloc"]
io-uring = ["rust-librocksdb-sys/io-uring"]
# Build RocksDB with folly + C++20 coroutines. See `librocksdb-sys/Cargo.toml`
# and the "Coroutines / async MultiGet" section of the README for build
# prerequisites. Linux only.
coroutines = ["rust-librocksdb-sys/coroutines"]
valgrind = ["rust-librocksdb-sys/valgrind"]
snappy = ["rust-librocksdb-sys/snappy"]
lz4 = ["rust-librocksdb-sys/lz4"]
zstd = ["rust-librocksdb-sys/zstd"]
zlib = ["rust-librocksdb-sys/zlib"]
bzip2 = ["rust-librocksdb-sys/bzip2"]
rtti = ["rust-librocksdb-sys/rtti"]
mt_static = ["rust-librocksdb-sys/mt_static"]
multi-threaded-cf = []
serde1 = ["serde"]
malloc-usable-size = ["rust-librocksdb-sys/malloc-usable-size"]
zstd-static-linking-only = ["rust-librocksdb-sys/zstd-static-linking-only"]
bindgen-runtime = ["rust-librocksdb-sys/bindgen-runtime"]
bindgen-static = ["rust-librocksdb-sys/bindgen-static"]
lto = ["rust-librocksdb-sys/lto"]
raw-ptr = []

[dependencies]
libc = "0.2"
rust-librocksdb-sys = { path = "librocksdb-sys", version = "0.48.0", default-features = false, features = [
    "static",
] }
serde = { version = "1", features = ["derive"], optional = true }
parking_lot = { version = "0.12" }

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3"
pretty_assertions = "1"

[[bench]]
name = "hot_paths"
harness = false
