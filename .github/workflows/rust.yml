name: RocksDB CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job here writes to the repository. Fork pull requests get a read-only
# token regardless, so this is what constrains the `push` runs on master, where
# the token is live while vendored C++ compiles and `install-action` fetches a
# binary.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  style:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt
          cache: false
          rustflags: ""

      - name: Run rustfmt
        run: cargo fmt --all -- --check

  # Everything checked here is generated from the vendored RocksDB source and
  # committed, and `MAINTAINERSHIP.md` asks the maintainer to regenerate it on
  # every submodule bump. Nothing verified that it happened.
  #
  # Staleness is silent in both directions. `Ticker` and `Histogram` are
  # `#[repr(u32)]` with implicit discriminants, so an enumerator inserted
  # upstream shifts every variant after it and the crate reports a different
  # RocksDB counter than the caller asked for. 0.52.0 shipped exactly that
  # shift. A stale `rocksdb_lib_sources.txt` instead drops newly added upstream
  # sources from the build, since `build.rs` reads it with `include_str!`.
  #
  # `tests/test_enum_drift.rs` covers the enums parsed out of the C++ headers.
  # This covers the generated files, which it cannot see.
  #
  # No RocksDB build, so a bad submodule bump fails here in about a minute
  # rather than after the matrix finishes.
  generated:
    name: Generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # `rocksdb_lib_sources.txt` is a real file target, so make compares
      # mtimes and does nothing after a fresh checkout, where every file shares
      # the checkout timestamp. Delete it to force the rule to run.
      - name: Regenerate everything derived from the submodule
        run: |
          make -C librocksdb-sys gen_statistics
          make -C librocksdb-sys gen_perf
          rm -f librocksdb-sys/rocksdb_lib_sources.txt
          make -C librocksdb-sys rocksdb_lib_sources.txt

      - name: Assert the committed files match the submodule
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- \
              src/statistics_enum_ticker.rs \
              src/statistics_enum_histogram.rs \
              src/perf_enum.rs \
              librocksdb-sys/rocksdb_lib_sources.txt; then
            echo "::error::generated files are stale. Run the same commands as the step above and commit the result. Note the 'rm' before rocksdb_lib_sources.txt: make will not rebuild it otherwise."
            exit 1
          fi

      # The `+` suffix on `rust-librocksdb-sys` is the only signal downstreams
      # have about which RocksDB they are linking, and the submodule tracks a
      # non-release commit. A bump that forgets the suffix misreports the
      # version to every consumer, and cannot be corrected after publishing.
      - name: Assert the version suffix matches the vendored RocksDB
        run: |
          set -euo pipefail
          h=librocksdb-sys/rocksdb/include/rocksdb/version.h
          major=$(sed -n 's/^#define ROCKSDB_MAJOR \([0-9]*\)$/\1/p' "$h")
          minor=$(sed -n 's/^#define ROCKSDB_MINOR \([0-9]*\)$/\1/p' "$h")
          patch=$(sed -n 's/^#define ROCKSDB_PATCH \([0-9]*\)$/\1/p' "$h")
          if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
            echo "::error::could not read the RocksDB version from $h"
            exit 1
          fi
          vendored="$major.$minor.$patch"

          declared=$(sed -n 's/^version = ".*+\(.*\)"$/\1/p' librocksdb-sys/Cargo.toml)
          if [ -z "$declared" ]; then
            echo "::error::librocksdb-sys/Cargo.toml has no +rocksdb-version build metadata"
            exit 1
          fi

          echo "vendored: $vendored, declared: $declared"
          if [ "$vendored" != "$declared" ]; then
            echo "::error::librocksdb-sys declares +$declared but the submodule is $vendored"
            exit 1
          fi

  # Doc warnings and doctests share a job because both need a fully built
  # `librocksdb-sys` and neither takes more than a moment once it exists.
  # Running them as separate jobs paid for the same RocksDB build twice.
  #
  # Doctests are not in nextest: https://github.com/nextest-rs/nextest/issues/16
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rust-docs
          cache-key: "v1-rust-docs"
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run cargo rustdoc
        run: cargo rustdoc -- -D warnings

      - name: Run doctests
        run: cargo test --doc

  # docs.rs builds the feature set named in `[package.metadata.docs.rs]` with
  # `--cfg docsrs`, which turns on the `doc_cfg` badges via `feature(doc_cfg)`
  # in lib.rs. That combination is built nowhere else, so a broken intra-doc
  # link inside a `serde1` or `raw-ptr` item first shows up as a red docs.rs
  # build, and docs.rs cannot be retried without publishing a new version.
  #
  # Its own job rather than a step in `docs`, because `feature(doc_cfg)` needs
  # nightly, and cargo keys the build-script output directory on the rustc
  # version, so a nightly rustdoc run rebuilds RocksDB from scratch instead of
  # reusing the stable build. Separate jobs at least run those two builds in
  # parallel.
  #
  # Advisory, not a gate. Nightly is unpinned and `-D warnings` means a new
  # rustdoc lint would otherwise turn every pull request red for a reason that
  # has nothing to do with the change.
  docsrs:
    name: Docs (docs.rs configuration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly
          components: rust-docs
          cache-key: "v1-rust-docsrs"
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run cargo doc as docs.rs builds it
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: |
          cargo doc --no-deps \
            --features serde1,multi-threaded-cf,raw-ptr

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y liburing-dev pkg-config

      - name: Set PKG_CONFIG_PATH
        run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Run clippy
        run: |
          cargo clippy --all-targets --features \
            "jemalloc \
            io-uring \
            valgrind \
            mt_static \
            rtti \
            multi-threaded-cf \
            malloc-usable-size \
            zstd-static-linking-only \
            serde1" \
            -- -D warnings

  # `rust-toolchain.toml` tracks stable, so nothing else here builds on the
  # MSRV. This job is what makes `rust-version` in Cargo.toml a real claim
  # rather than a number in a manifest. It reads that field instead of
  # repeating it, so the two cannot drift.
  #
  # `cargo check` on the default features is deliberate. The question is
  # whether the declared MSRV still compiles the crate, not whether the suite
  # passes on it a second time. The explicit `+toolchain` is required because
  # `rust-toolchain.toml` would otherwise win over the rustup default.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Read the declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$v" ]; then
            echo "::error::could not read rust-version from Cargo.toml"
            exit 1
          fi
          echo "declared MSRV: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install rust ${{ steps.msrv.outputs.version }}
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-key: "v1-rust-msrv"
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check on the declared MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --all-targets

  # Every other job builds for the target's baseline CPU, where
  # x86_64-unknown-linux-gnu reports only fxsr, sse and sse2. `build.rs` turns
  # target features into `-march`/`-mcpu` and into RocksDB and snappy defines,
  # so a tuned build takes entirely different code paths. A snappy build break
  # under `-Ctarget-cpu` shipped in 0.51.0 precisely because nothing here ever
  # left the baseline. `native` rather than a fixed level so the job keeps
  # matching whatever the runners actually are.
  build-tuned-cpu:
    name: Tuned CPU build - ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build: [Linux, Linux-ARM]
        include:
          - build: Linux
            os: ubuntu-latest
          - build: Linux-ARM
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # Nothing this job caches may contain machine code. `native` bakes
          # whatever the saving runner supported into every host artifact,
          # including the dependency rlibs that get linked into `build.rs`, and
          # the hosted fleet spans CPU generations, so restoring those onto a
          # narrower machine kills the build script with SIGILL. That rules out
          # `target` and `~/.cargo/bin`, leaving the registry and git checkouts,
          # which are only sources. Costs about two minutes, 8m09s cold against
          # 6m05s warm, because the cache never covered the RocksDB build in the
          # first place: `librocksdb-sys` is a workspace member, and it was 5m17s
          # of that warm run.
          cache-key: "v2-rust-tuned-cpu"
          cache-targets: false
          cache-bin: false
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}
          rustflags: ""

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      - name: Run tests with -Ctarget-cpu=native
        env:
          RUSTFLAGS: -Ctarget-cpu=native
        run: cargo nextest run --all

  # Nothing else builds without the default features, so a compression backend
  # that only compiles because a sibling feature happens to pull in its headers
  # goes unnoticed. Check builds only; the point is that each combination
  # compiles and links, which the default matrix already covers behaviourally.
  build-feature-matrix:
    name: Feature build - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            features: "--no-default-features"
          - name: snappy only
            features: "--no-default-features --features snappy"
          - name: lz4 only
            features: "--no-default-features --features lz4"
          - name: zstd only
            features: "--no-default-features --features zstd"
          - name: zlib only
            features: "--no-default-features --features zlib"
          - name: bzip2 only
            features: "--no-default-features --features bzip2"
          - name: serde1 + multi-threaded-cf
            features: "--features serde1,multi-threaded-cf"
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-key: "v1-rust-features"
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}

      # `--no-default-features` drops `bindgen-runtime`, and with neither
      # bindgen feature `clang-sys` stops loading libclang at runtime and
      # links it instead, which needs `llvm-config` from llvm-dev to locate
      # `libclang.so` from libclang-dev. Neither is on the runner by default.
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm-dev libclang-dev clang

      - name: Check ${{ matrix.name }}
        run: cargo check --all-targets ${{ matrix.features }}

  # What we publish is not what we test. Every other job builds from the git
  # checkout; users build from a tarball assembled by the `exclude` list in
  # `librocksdb-sys/Cargo.toml`. Trimming one glob too far breaks every
  # downstream build and cannot be fixed without publishing a new version, so
  # verify the tarball itself.
  package:
    name: Package verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-key: "v1-rust-package"
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}

      # No `--no-verify`: the point of this job is that cargo unpacks the
      # tarball into `target/package` and compiles RocksDB from it, which is
      # what proves the exclude list did not drop a header.
      - name: Package and build from the tarball
        run: cargo package -p rust-librocksdb-sys

      # An exclude list silently admits whatever upstream adds next, so assert
      # the result instead of trusting the patterns. RocksDB keeps tests in
      # `*_test.cc` beside the sources, which is how 222 test files, the Java
      # bindings and db_stress_tool were being published in the first place.
      #
      # This job runs with `submodules: recursive`, which is the point: snappy's
      # googletest and benchmark submodules are absent from a shallow clone, so
      # a local `cargo package` will not show them.
      - name: Assert the tarball stays trimmed
        run: |
          set -euo pipefail
          cargo package --list -p rust-librocksdb-sys > /tmp/pkg.txt
          total=$(wc -l < /tmp/pkg.txt)
          echo "packaged files: $total"

          fail=0
          for pat in '_test\.cc$' '^rocksdb/java/' '^rocksdb/db_stress_tool/' \
                     '^rocksdb/microbench/' '^rocksdb/fuzz/' '^rocksdb/buckifier/' \
                     '^snappy/third_party/'; do
            n=$(grep -cE "$pat" /tmp/pkg.txt || true)
            if [ "$n" -ne 0 ]; then
              echo "::error::$n packaged files match $pat, which nothing compiles"
              fail=1
            fi
          done

          # Ceiling with room for ordinary upstream growth. A jump past this
          # means a new directory started riding along; extend the exclude list
          # rather than raising the number.
          if [ "$total" -gt 1200 ]; then
            echo "::error::$total packaged files exceeds the 1200 ceiling"
            fail=1
          fi

          # The other direction: these are load-bearing and easy to strip by
          # accident. gtest is on the include path and three test_util files
          # are compiled.
          for pat in '^rocksdb/third-party/gtest-1.8.1/fused-src/' '^rocksdb/test_util/' \
                     '^rocksdb/tools/dump/db_dump_tool\.cc$'; do
            if ! grep -qE "$pat" /tmp/pkg.txt; then
              echo "::error::nothing matches $pat, but the build needs it"
              fail=1
            fi
          done

          exit $fail

      # The sys crate got all the packaging attention while the root crate got
      # none. Its `exclude` list had been dead for years: it named `test/**/*`
      # while the directory is `tests/`, so all 40 integration tests and the
      # criterion bench shipped to crates.io, none of which a downstream can
      # compile. That took the tarball from 123 files to 61.
      #
      # `--list` and not `cargo package`. Building the root tarball resolves
      # `rust-librocksdb-sys` from the registry, which fails for the whole
      # release-prep window between bumping the sys version and publishing it.
      # `--list` reads the manifest without resolving, so it works then too.
      - name: Assert the root crate tarball carries only what compiles
        run: |
          set -euo pipefail
          cargo package --list -p rust-rocksdb > /tmp/root.txt
          echo "packaged files: $(wc -l < /tmp/root.txt)"

          fail=0
          for pat in '^tests/' '^benches/' '^\.github/' '^\.vscode/'; do
            n=$(grep -cE "$pat" /tmp/root.txt || true)
            if [ "$n" -ne 0 ]; then
              echo "::error::$n packaged files match $pat, which nothing downstream compiles"
              fail=1
            fi
          done

          # The opposite mistake: an exclude glob that eats something the crate
          # needs. `build_folly.sh` is here because the packaged README tells
          # `coroutines` users to run it, and the .md is pulled in by
          # `include_str!` from src/db.rs.
          for pat in '^src/lib\.rs$' '^src/db\.rs$' '^LICENSE$' '^README\.md$' \
                     '^scripts/build_folly\.sh$' \
                     '^src/db_create_column_family_with_import\.md$'; do
            if ! grep -qE "$pat" /tmp/root.txt; then
              echo "::error::nothing matches $pat, but the crate needs it"
              fail=1
            fi
          done

          exit $fail

  # Both feature sets run in one job because `multi-threaded-cf = []` enables
  # nothing in `rust-librocksdb-sys`, so the two builds link a byte-identical
  # RocksDB. As separate jobs they paid for that C++ build twice on each of the
  # four runners. Sharing one `target/` means the second `nextest` invocation
  # only recompiles the root crate.
  #
  # `test-jemalloc` and `test-release` stay separate below: those genuinely
  # change the native build.
  # `MAINTAINERSHIP.md` commits to semver, and the 0.52.0 changelog is full of
  # hand-classified `fix!` entries for lifetime and signature changes on
  # `WriteBatchWithIndex::iterator_with_base`, `get_pinned_from_batch_and_db`
  # and `Snapshot::iterator`. Lifetime breakage in a wrapper crate is exactly
  # what this detects mechanically, and it was being caught by a human reading
  # their own diff.
  #
  # Advisory rather than a gate, because the version bump lives in the separate
  # "Release X.Y.Z" commit. Between releases `Cargo.toml` still carries the
  # published version, so every accumulated breaking change reads as an unbumped
  # one and the job would sit red until the next release.
  #
  # Not `continue-on-error`: that hides a job that could not run at all just as
  # thoroughly as it hides findings. The step reads the exit code instead, which
  # cargo-semver-checks documents as 0 clean, 100 violations found, 101 could not
  # complete. Only 100 is downgraded.
  semver:
    name: Semver checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-key: "v1-rust-semver"
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-semver-checks

      # Only the root crate. `rust-librocksdb-sys` is bindgen output, where
      # every RocksDB bump legitimately rewrites the API surface.
      #
      # The feature set is named rather than left to the default heuristic,
      # which would enable `coroutines` (needs a folly install) and `io-uring`
      # (needs liburing). This is the same set docs.rs builds, so it is the
      # public API as documented.
      - name: Check semver against the published version
        env:
          # The workflow sets `always` globally, which would put escape codes in
          # the job summary.
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail

          status=0
          cargo semver-checks --package rust-rocksdb \
            --default-features \
            --features serde1,multi-threaded-cf,raw-ptr \
            > semver.txt 2>&1 || status=$?
          cat semver.txt

          if [ "$status" -eq 0 ]; then
            echo "No semver violations against the published version." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$status" -ne 100 ]; then
            echo "::error::cargo semver-checks could not complete (exit $status)"
            exit "$status"
          fi

          # Exit 100. A notice rather than a warning: this fires on every PR
          # between releases, and the point is a running tally to write the
          # changelog from, not something to act on per-PR.
          echo "::notice::Breaking changes accumulated since the published release; see the job summary."
          {
            echo "### Breaking changes since the published release"
            echo
            echo "\`Cargo.toml\` still carries the published version, so these"
            echo "are the changes that decide the next version number."
            echo
            echo '```'
            cat semver.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build: [Linux, Linux-ARM, macOS, Windows]
        include:
          - build: Linux
            os: ubuntu-latest
          - build: Linux-ARM
            os: ubuntu-24.04-arm
          - build: macOS
            os: macos-latest
          - build: Windows
            os: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      - name: Remove msys64 # Workaround to resolve link error with C:\msys64\mingw64\bin\libclang.dll
        if: runner.os == 'Windows'
        run: Remove-Item -LiteralPath "C:\msys64\" -Force -Recurse

      - name: Install dependencies
        if: runner.os == 'Windows'
        run: choco install llvm -y

      - name: Mark working directory as read-only
        if: runner.os == 'Linux'
        run: |
          mkdir -p target
          touch Cargo.lock
          chmod -R a-w .
          chmod -R a+w target Cargo.lock

      - name: Run rocksdb tests
        run: cargo nextest run --all

      - name: Run rocksdb tests (multi-threaded-cf)
        run: cargo nextest run --all --features multi-threaded-cf

      # `always()` so a failing test still restores write permission. Without
      # it the post-checkout and post-cache steps cannot write .git/config, and
      # the real failure gets buried under a permissions error.
      - name: Mark working directory as writable
        if: always() && runner.os == 'Linux'
        run: chmod -R a+w .

  test-jemalloc:
    name: Test with jemalloc - ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build: [Linux, Linux-ARM, macOS]
        include:
          - build: Linux
            os: ubuntu-latest
          - build: Linux-ARM
            os: ubuntu-24.04-arm
          - build: macOS
            os: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-key: "v1-rust-jemalloc"
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      - name: Mark working directory as read-only
        if: runner.os == 'Linux'
        run: |
          mkdir -p target
          touch Cargo.lock
          chmod -R a-w .
          chmod -R a+w target Cargo.lock

      - name: Run rocksdb tests with jemalloc
        run: cargo nextest run --all --features jemalloc

      # `always()` so a failing test still restores write permission. Without
      # it the post-checkout and post-cache steps cannot write .git/config, and
      # the real failure gets buried under a permissions error.
      - name: Mark working directory as writable
        if: always() && runner.os == 'Linux'
        run: chmod -R a+w .

  # Everything else runs the debug profile. Release turns on optimization and
  # turns off debug_assertions, which changes both what the optimizer is
  # allowed to assume about the FFI boundary and which assertions run.
  test-release:
    name: Test release profile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-key: "v1-rust-release"
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      - name: Run rocksdb tests (release)
        run: cargo nextest run --all --release

  test-sanitizers:
    name: Test with Address/LeakSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly
          components: rust-src
          cache-key: "v1-rust-asan"
          cache-save-if: ${{ github.ref == 'refs/heads/master' }}
          rustflags: ""

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang

      # `--lib --bins` skipped `tests/`, which is where nearly all of the FFI
      # coverage lives, so the job was running almost none of the code it was
      # meant to check. CFLAGS/CXXFLAGS carry the sanitizer into the `cc`
      # build, without which an overflow performed by uninstrumented C++ has no
      # instrumented load to trip on. `build.rs` looks for "sanitize" in those
      # vars and keeps its dev-profile size optimizations out of the way.
      #
      # Do not add `-fsanitize=address` as a link arg. `-Zsanitizer=address`
      # already links rustc's ASan runtime, and adding clang's on top of it
      # gives duplicate symbol definitions for the whole runtime.
      #
      # `--jobs 2` because linking these binaries takes several GB each and a
      # runner-wide parallel link gets the linker OOM-killed.
      - name: Run tests with Address/LeakSanitizer
        env:
          CC: clang
          CXX: clang++
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          CFLAGS: -fsanitize=address -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:abort_on_error=1:print_stats=1
        run: |
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
            --all --lib --bins --tests --jobs 2
