[package]
name = "rust-librocksdb-sys"
version = "0.48.0+11.8.1"
edition = "2024"
rust-version = "1.91.0"
authors = [
    "Karl Hobley <karlhobley10@gmail.com>",
    "Arkadiy Paronyan <arkadiy@ethcore.io>",
]
# Slash-separated licences are deprecated syntax. Cargo already read the old
# form as OR, so this is the same choice-of-three expressed in valid SPDX.
license = "MIT OR Apache-2.0 OR BSD-3-Clause"
description = "Native bindings to librocksdb"
readme = "README.md"
repository = "https://github.com/zaidoon1/rust-rocksdb"
keywords = ["bindings", "ffi", "rocksdb"]
categories = ["api-bindings", "database", "external-ffi-bindings"]
links = "rocksdb"

exclude = [
    ".gitignore",
    "*.yml",
    "snappy/testdata",
    # googletest and google benchmark, snappy's own test dependencies. They are
    # nested submodules, so they are only present once someone clones with
    # `--recursive`, which is why this is easy to miss locally and not in CI.
    # `build.rs` compiles three files out of snappy and never looks here.
    "snappy/third_party",
    "*/doc",
    "*/docs",
    "*/examples",
    "*/tests",
    "tests",
    # Strip the large vendored RocksDB documentation.
    "rocksdb/**/*.md",

    # Everything below is vendored RocksDB that `build.rs` never compiles.
    # `rocksdb_lib_sources.txt` plus `c-api-extensions/` is the whole build,
    # and none of these paths appear in it. `*/tests` above does not catch any
    # of it, because RocksDB keeps its tests in `*_test.cc` next to the
    # sources rather than in a tests directory, so before this the published
    # crate carried roughly four files for every one it built.
    #
    # Do not add `rocksdb/third-party` here: `build.rs` puts
    # `rocksdb/third-party/gtest-1.8.1/fused-src/` on the include path.
    #
    # `rocksdb/test_util` also has to stay. Three of its files are compiled.
    "rocksdb/**/*_test.cc",
    "rocksdb/java",
    "rocksdb/db_stress_tool",
    "rocksdb/microbench",
    "rocksdb/fuzz",
    "rocksdb/buckifier",
    "rocksdb/build_tools",
    "rocksdb/cmake",
    "rocksdb/unreleased_history",

    # `tools/dump/db_dump_tool.cc` is the one compiled file under `tools`, and
    # it includes nothing else from there, so keep that directory and drop the
    # rest.
    "rocksdb/tools/advisor",
    "rocksdb/tools/block_cache_analyzer",
    "rocksdb/tools/*.cc",
    "rocksdb/tools/*.h",
    "rocksdb/tools/*.py",
    "rocksdb/tools/*.sh",
]

[features]
default = ["static", "bindgen/runtime"]
jemalloc = ["tikv-jemalloc-sys"]
static = ["libz-sys?/static", "bzip2-sys?/static"]
bindgen-runtime = ["bindgen/runtime"]
bindgen-static = ["bindgen/static"]
mt_static = []
io-uring = []
# Build RocksDB with `USE_COROUTINES=1 USE_FOLLY=1` and link against a folly
# install. Enables the multi-level parallel `MultiGet` async-IO path described
# in the RocksDB blog post "Asynchronous IO in RocksDB". Linux only. Requires
# the `ROCKSDB_FOLLY_INSTALL_PATH` env var to point at a folly install built
# by `scripts/build_folly.sh` (or equivalent). Adds a runtime dependency on
# `libglog.so` and `libgflags.so` because folly's build does not produce
# static archives for those two.
coroutines = []
snappy = []
lz4 = ["lz4-sys"]
zstd = ["zstd-sys"]
zlib = ["libz-sys"]
bzip2 = ["bzip2-sys"]
rtti = []
malloc-usable-size = []
zstd-static-linking-only = []
lto = []
# Define ROCKSDB_VALGRIND_RUN. RocksDB uses it to skip work that is only
# correct or only finishes in reasonable time outside Valgrind. Build with
# this before running the test suite under Memcheck.
valgrind = []

[dependencies]
libc = "0.2"
tikv-jemalloc-sys = { version = "0.7", features = [
    "unprefixed_malloc_on_supported_platforms",
], optional = true }
lz4-sys = { version = "1.11", optional = true }
zstd-sys = { version = "2.0", default-features = false, features = [
    "legacy",
    "zdict_builder",
    "experimental",
], optional = true }
libz-sys = { version = "1.1", default-features = false, optional = true }
bzip2-sys = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
const-str = "0.6"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
bindgen = { version = "0.72", default-features = false }
glob = "0.3"
pkg-config = "0.3"
rustflags = "0.1"
